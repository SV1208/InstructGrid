# experiments/configs/v2_stage1.yaml
# ------------------------------------
# Stage 1: Instruction at every step + LayerNorm + Dropout + deeper CNN

data_path:  language_demo_data.jsonl
vocab_path: utils/vocab.json
model_out:  logs/v2_best.pth
log_dir:    logs

epochs:     50
lr:         0.0003
batch_size: 64
embed_dim:  64
hidden_dim: 128
dropout:    0.2
max_len:    20

augment:    false    # set true if you have enough demos
val_frac:   0.1
seed:       42
