# experiments/configs/v4_film.yaml
# ----------------------------------
# Stage 3: FiLM conditioning + auxiliary object-prediction loss

data_path:       language_demo_data.jsonl
vocab_path:      utils/vocab.json
model_out:       logs/v4_best.pth
log_dir:         logs

epochs:          70
lr:              0.0001
batch_size:      64
embed_dim:       64
hidden_dim:      128
num_heads:       4
dropout:         0.2
max_len:         20

augment:         true
val_frac:        0.1
seed:            42

use_aux_obj:     true
use_aux_subgoal: false
lambda_obj:      0.2
lambda_subgoal:  0.1
